<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampada JS</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <h1>Controlando uma Lâmpada com JS</h1>
        <h2>Acione o interruptor para acender a lâmpada!</h2>

    <main>
        <div class="lampada">
            <img src="assets/lampada-apagada.png" alt="" id="lampada">

        <div class="interruptor">
            <img src="assets/switch-off.png" alt="" id="onOff">
        </div>
        <h3>Não toque na lâmpada!</h3>
    </main>
